# Publish @numaya/greenlight to npm with provenance (npm trusted publishing).
#
# The repository is now public, so npm will issue OIDC provenance and the
# original blocker is gone. This stays **manual dispatch only** — publishing is
# a product decision and should not happen because someone pushed a tag. Add a
# tag trigger deliberately if you ever want that:
#
#     on:
#       push:
#         tags: ['v*']
#
# ── Why provenance matters here, beyond the trust badge ───────────────────────
#
# Twenty's marketplace claim flow verifies the GitHub organisation named in the
# package's npm provenance. Publishing with
# `TWENTY_APP_PUBLISH_DISABLE_PROVENANCE: 'true'` would succeed and then leave
# the app unclaimable — the listing could not be proved ours. Never set it.
#
# ── The first publish is the awkward one ──────────────────────────────────────
#
# npm configures a trusted publisher on a *package*, and @numaya/greenlight does
# not exist yet. So either:
#
#   a. Do the first publish with a short-lived granular token scoped to this one
#      package, then add the trusted publisher and revoke the token; or
#   b. Register the trusted publisher first if npm lets you pre-create it for an
#      unpublished name under an org you own.
#
# Every publish after the first needs no credential at all. `id-token: write` is
# the only extra permission required. Do not add NODE_AUTH_TOKEN or an .npmrc
# credential to this file for the steady state.
#
# ── Before dispatching ────────────────────────────────────────────────────────
#
#  1. Bump the version in app/package.json. npm rejects a republished version,
#     and so does Twenty's own server registry — which is monotonic and is not
#     reset by an uninstall.
#  2. Remember the marketplace listing is a separate, later step: claim the app
#     from a Twenty workspace's Developer tab via GitHub OAuth (matched against
#     this provenance), then submit it for review by a server admin.
name: Publish

on:
  workflow_dispatch: {}

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC provenance).
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish from a private repository
        # npm rejects OIDC provenance from a private repo (E422), and publishing
        # without provenance forfeits the marketplace claim. Fail before doing
        # anything rather than producing an unclaimable release.
        run: |
          visibility='${{ github.event.repository.visibility }}'
          if [ "$visibility" != 'public' ]; then
            echo "::error::${{ github.repository }} is '$visibility'. npm rejects OIDC provenance"
            echo "::error::from a private repository, and publishing without provenance would make"
            echo "::error::the app unclaimable in the Twenty marketplace. Make the repo public."
            exit 1
          fi
          echo "Repository is public; provenance can be issued."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        # The scaffold omitted this and then called `yarn install`, which would
        # have failed on a runner with no yarn on PATH.
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: yarn
          cache-dependency-path: app/yarn.lock
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # Trusted publishing requires npm 11.5.1 or later.
        #
        # Pinned to the 11.x line, not `@latest`. `@latest` reached npm 12, which
        # requires node ^22.22.2 || ^24.15.0 || >=26.0.0 and so refuses to install
        # on the node this app pins in app/.nvmrc (24.5.0) — the publish failed
        # here on 2026-08-07 having never reached the npm registry. The runner
        # already ships 11.5.1, so this is a floor, not an upgrade, and it only
        # acts if a future image regresses below the trusted-publishing minimum.
        #
        # Raising app/.nvmrc past 24.15.0 would let `@latest` work again, but the
        # node version is the app's runtime baseline and is not the CI's to move.
        run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Publish to npm
        working-directory: app
        # Publishing from a private source repo would need
        #   env:
        #     TWENTY_APP_PUBLISH_DISABLE_PROVENANCE: 'true'
        # which forfeits the marketplace ownership claim. Read the header first.
        run: yarn twenty app:publish
